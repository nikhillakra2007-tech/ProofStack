services:
  postgres:
    image: postgres:16-alpine
    container_name: proofstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: proofstack
      POSTGRES_USER: proofstack
      POSTGRES_PASSWORD: proofstack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofstack -d proofstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proofstack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
