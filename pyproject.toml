[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofstack"
version = "0.1.0"
description = "PerfProof / proofstack: Autonomous Verification Engine with Zero-Compromise Gate & Live-Target DAST"
authors = [
    {name = "Nitin", email = "nitin@perfproof.local"},
    {name = "Nikhil", email = "nikhil@perfproof.local"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyjwt[crypto]>=2.8.0",
    "jsonschema>=4.20.0",
    "regex>=2024.0.0"
]

[project.scripts]
proofstack = "proofstack.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["proofstack*"]
