policy:
  name: "default"
  tau_min: 0.05
  k: 2.0
  decimal_slowdown_cap: 3.0
  token_budget: 120000
  max_patch_iterations: 3
  cv_baseline_threshold: 0.15
  sandbox:
    timeout_s: 60
    memory_mb: 1024
    max_processes: 64
    max_output_bytes: 1048576
    network: "none"
  gates:
    g0_required: true
    g1_required: true
    g2_required: true
    g3_required: true
    g4_required: true
    g5_required: true
    g6_required: true
    g7_required: true
