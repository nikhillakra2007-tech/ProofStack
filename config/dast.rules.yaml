version: "1.0"
limits:
  max_rps: 2
  max_requests: 300
  page_load_timeout_s: 60
  body_size_cap_mb: 2
  scan_wall_clock_timeout_s: 600

d01_headers:
  required_headers:
    - name: "Content-Security-Policy"
      severity: "Medium"
      owasp: "A05"
    - name: "Strict-Transport-Security"
      severity: "Medium"
      owasp: "A05"
      https_only: true
    - name: "X-Content-Type-Options"
      expected: "nosniff"
      severity: "Medium"
      owasp: "A05"
    - name: "Referrer-Policy"
      severity: "Low"
      owasp: "A05"
  clickjacking:
    check_csp_frame_ancestors: true
    fallback_header: "X-Frame-Options"
    severity: "Medium"
    owasp: "A05"
  permissions_policy:
    severity: "Low"
    owasp: "A05"

d02_csp:
  banned_tokens:
    - "unsafe-inline"
    - "unsafe-eval"
  wildcard_sources:
    - "*"
    - "https:"
    - "data:"
  mandatory_directives:
    - "object-src"
    - "base-uri"
    - "frame-ancestors"

d03_cookies:
  auth_pattern: "(?i)session|sid|auth|token|jwt|csrf|key"
  required_flags:
    - "HttpOnly"
    - "Secure"
  valid_samesite:
    - "Strict"
    - "Lax"

d04_transport:
  require_hsts: true
  flag_mixed_content: true
  flag_cleartext_password_form: true

d05_secrets:
  entropy_threshold: 4.0
  min_literal_length: 20
  patterns:
    - id: "aws_access_key"
      regex: "AKIA[0-9A-Z]{16}"
    - id: "github_token"
      regex: "gh[pousr]_[A-Za-z0-9_]{36,}"
    - id: "slack_token"
      regex: "xox[baprs]-[0-9A-Za-z]{10,}"
    - id: "stripe_key"
      regex: "sk_(?:live|test)_[0-9a-zA-Z]{24,}"
    - id: "private_key"
      regex: "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    - id: "generic_api_key"
      regex: "(?i)(?:api_key|apikey|secret|password|bearer|auth_token)\\s*[=:]\\s*['\"][A-Za-z0-9_\\-]{16,}['\"]"

d06_dom_xss:
  sinks:
    - "innerHTML"
    - "outerHTML"
    - "insertAdjacentHTML"
    - "document.write"
    - "eval"
    - "new Function"
    - "setTimeout"
    - "setInterval"
  sources:
    - "location."
    - "document.URL"
    - "document.referrer"
    - "window.name"
    - "postMessage"
  canary_prefix: "pp_canary_"

d07_sensitive_routes:
  paths:
    - path: "/.env"
      signature: "(?m)^[A-Z0-9_]+=[^\\r\\n]+"
    - path: "/.git/HEAD"
      signature: "^ref: refs/"
    - path: "/admin"
      signature: "(?i)admin|dashboard|management"
    - path: "/debug"
      signature: "(?i)debug|trace|profiler"
    - path: "/actuator/health"
      signature: '\{.*"status".*:.*"(?:UP|DOWN)".*\}'
    - path: "/swagger"
      signature: "(?i)swagger"
    - path: "/openapi.json"
      signature: '\{.*"openapi".*\}'
    - path: "/server-status"
      signature: "(?i)Apache Server Status"
    - path: "/backup.zip"
      signature: "^PK\\x03\\x04"
    - path: "/.aws/credentials"
      signature: "(?i)\\[default\\]"
    - path: "/.docker/config.json"
      signature: '\{.*"auths".*\}'
    - path: "/config.json"
      signature: '\{.*"(?:db|database|secret|key)".*\}'
    - path: "/wp-config.php.bak"
      signature: "(?i)DB_PASSWORD"
    - path: "/id_rsa"
      signature: "-----BEGIN RSA PRIVATE KEY-----"
    - path: "/id_ed25519"
      signature: "-----BEGIN OPENSSH PRIVATE KEY-----"
    - path: "/graphql?query={__schema{types{name}}}"
      signature: '\{.*"__schema".*\}'

d08_cors:
  test_origin: "https://pp-probe.invalid"

d09_info_disclosure:
  fingerprint_headers:
    - "Server"
    - "X-Powered-By"
    - "X-AspNet-Version"
    - "X-Runtime"
  debug_signatures:
    - "Traceback (most recent call last):"
    - "ZeroDivisionError"
    - "TypeError:"
    - "Unhandled Exception"
    - "DEBUG = True"

d10_third_party:
  require_sri_crossorigin: true
  vulnerable_fingerprints:
    - name: "jquery"
      max_version: "3.4.0"
    - name: "lodash"
      max_version: "4.17.20"
    - name: "angularjs"
      max_version: "1.8.0"

d11_storage_tokens:
  jwt_regex: "^[A-Za-z0-9-_=]+\\.[A-Za-z0-9-_=]+\\.[A-Za-z0-9-_.+/=]*$"

d12_forms:
  csrf_field_pattern: "(?i)csrf|_token|authenticity_token"
