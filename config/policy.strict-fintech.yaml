policy:
  name: "strict-fintech"
  tau_min: 0.02
  k: 3.0
  decimal_slowdown_cap: 2.0
  token_budget: 180000
  max_patch_iterations: 5
  cv_baseline_threshold: 0.08
  sandbox:
    timeout_s: 45
    memory_mb: 1024
    max_processes: 48
    max_output_bytes: 1048576
    network: "none"
  gates:
    g0_required: true
    g1_required: true
    g2_required: true
    g3_required: true
    g4_required: true
    g5_required: true
    g6_required: true
    g7_required: true
